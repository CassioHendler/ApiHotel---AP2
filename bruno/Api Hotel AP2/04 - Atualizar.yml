info:
  name: 04 - Atualizar
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/quartos/{{quartoId}}"
  body:
    type: json
    data: |-
      {
        "titulo": "Quarto 301 - Suíte Luxo Reformada",
        "disponivel": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Atualizar retorna 200", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.deep.equal({
            id: Number(bru.getVar("quartoId")),
            titulo: "Quarto 301 - Suíte Luxo Reformada",
            disponivel: false
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
