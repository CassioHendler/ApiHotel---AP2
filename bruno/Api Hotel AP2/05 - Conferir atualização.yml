info:
  name: 05 - Conferir atualização
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/quartos/{{quartoId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Conferir atualização retorna 200", () => {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody()).to.deep.equal({
            id: Number(bru.getVar("quartoId")),
            titulo: "Quarto 301 - Suíte Luxo Reformada",
            disponivel: false
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
